- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant
      institution: Department of Aerospace Engineering, Indian Institute of Technology Kharagpur
      year: Aug 2021 – Present
      description:
        - Conducting doctoral research on guidance and control of autonomous aerial vehicles.
        - Developing nonlinear guidance algorithms for UAV path following, obstacle avoidance, curvature-constrained trajectory generation, and impact-angle-constrained missile guidance.
        - Designing vector-field guidance laws and Lyapunov-based control strategies.
        - Validating guidance and control algorithms using MATLAB/Simulink, Quanser QDrone, and OptiTrack motion capture systems.

    - title: Project Associate
      institution: Advanced Technology Development Centre (ATDC), CSIR-Central Mechanical Engineering Research Institute, Durgapur
      year: Dec 2020 – Jul 2021
      description:
        - Contributed to the design and development of a tendon-driven robotic hand exoskeleton for post-stroke rehabilitation.
        - Developed mechanical components and evaluated prototype performance.

    - title: Research Assistant
      institution: CSIR-Central Mechanical Engineering Research Institute, Durgapur
      year: Jul 2019 – Aug 2020
      description:
        - Conducted research on flexible and stretchable strain sensors for wearable robotic exosuits.
        - Designed and experimentally characterized conductive fabric-based soft sensors and pneumatic artificial muscles.

